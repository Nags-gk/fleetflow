[package]
name = "fleetflow-core"
version = "0.1.0"
edition = "2021"
description = "Multi-robot warehouse fleet coordination: MAPF (CBS, space-time A*), Hungarian task assignment, congestion-aware lifelong simulation"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
